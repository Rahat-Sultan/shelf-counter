[server]
# No server.address here on purpose: phones on the same Wi-Fi and Streamlit Community Cloud must be able to
# reach the app. To keep it on this laptop only, run: streamlit run app.py --server.address localhost
#
# Matches MAX_VIDEO_MB in src/config.py, so the browser rejects bigger files before uploading them.
maxUploadSize = 100

[browser]
gatherUsageStats = false
